<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Habesha Eatery today for our phone number, location map, and operating hours.">
    <title>Contact - Habesha Eatery</title>
</head>

<body>
    <h1>Contact Us</h1>

    <br>

    <form action="https://example.com">
        <h2>Get in touch</h2>
        <div>
            <label for="name">Name</label><br>
            <input type="text" name="name" id="name">
        </div>
        <br>
        <div>
            <label for="email">Email</label><br>
            <input type="text" name="email" id="email">
        </div>
        <br>
        <div>
            <label for="message">Message</label> <br>
            <textarea name="message" id="message"></textarea>
        </div>
        <br>
        <button type="submit">Send</button>
    </form>

    <br><br>

    <section>
        <h2>Opening Hours</h2>
        <table border="1" style="width: 400px;">
            <caption>Working hours of Habesha Eatery</caption>
            <thead>
                <tr>
                    <th scope="col">Days</th>
                    <th scope="col">Hours</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>7:00 AM - 8:00 PM</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td>7:00 AM - 8:00 PM</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>7:00 AM - 8:00 PM</td>
                </tr>
                <tr>
                    <td>Thursday</td>
                    <td>7:00 AM - 8:00 PM</td>
                </tr>
                <tr>
                    <td>Friday</td>
                    <td>7:00 AM - 8:00 PM</td>
                </tr>
                <tr>
                    <td>Saturday</td>
                    <td>7:00 AM - 10:00 PM</td>
                </tr>
                <tr>
                    <td>Sunday</td>
                    <td>7:00 AM - 8:00 PM</td>
                </tr>
            </tbody>
        </table>
    </section>

    <br><br>

    <a href="./index.html">Back to home page</a>
</body>

</html>

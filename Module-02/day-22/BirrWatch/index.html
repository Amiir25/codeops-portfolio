<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirrWatch - Currency Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>BirrWatch - Currency Converter</h1>
    </header>
    <main>
        <section class="input-area">
            <div class="etb">
                <label for="etb-input">Amount</label>
                <input type="number" id="etb-input" placeholder="1000">
            </div>
            <div class="other-currency">
                <select name="currency" id="currency">
                    <option value="">Select Currency</option>
                    <option value="usd">USD</option>
                    <option value="euro">Euro</option>
                </select>
            </div>
        </section>
        
        <section class="output-area"></section>

        <section class="watchlist"></section>

    </main>

    <script src="./script.js"></script>
</body>
</html>
